version: 2

project_name: flickr

builds:
  - id: flickr
    main: ./cmd/flickr
    binary: flickr
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Version={{.Version}}
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "flickr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: thedavidweng
    name: flickr-cli
  mode: keep-existing

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

homebrew_casks:
  - name: flickr
    binaries:
      - flickr
    generate_completions_from_executable:
      executable: "flickr"
      args:
        - completion
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thedavidweng/flickr-cli"
    description: "Agent-friendly CLI for Flickr photo management, backup, upload, and API access"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
