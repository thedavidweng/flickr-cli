version: 2

project_name: flickr

builds:
  - id: flickr
    main: ./cmd/flickr
    binary: flickr
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Version={{.Version}}
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/thedavidweng/flickr-cli/internal/cli.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post: bash scripts/sign-and-notarize.sh "{{ .Os }}" "{{ .Path }}" "{{ .IsSnapshot }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "flickr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: thedavidweng
    name: flickr-cli
  mode: append

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"