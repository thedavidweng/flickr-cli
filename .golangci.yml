version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thedavidweng/flickr-cli

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
    - path: internal/testutil/
      linters:
        - dupl
  max-issues-per-linter: 0
  max-same-issues: 0
