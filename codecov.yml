coverage:
  status:
    project: false
    patch: false
  ignore:
    - "cmd/**"                    # Entry point
    - "internal/testutil/**"      # Test infrastructure
    - "internal/model/**"         # Pure struct definitions

  precision: 1
  round: down
  range: "60...100"

component_management:
  individual_components:
    - component_id: cmd
      name: cmd
      paths:
        - cmd/**
    - component_id: internal
      name: internal
      paths:
        - internal/**

comment:
  layout: "header, diff, flags, components, files"
  require_changes: true
